# Automatsko preuzimanje podataka o vozovima (Francuska: SNCF, Švajcarska: opentransportdata.swiss, Belgija: SNCB)
name: SNCF podaci

# Kašnjenja se osvežavaju automatski u Supabase-u (Edge funkcije, svakog minuta), zato ih ovde više nema.
# Ovde je samo red vožnje (svakog dana) i provera mapa i podataka posle njega.
on:
  schedule:
    - cron: "20 1 * * *"    # red vožnje (sve zemlje): jednom dnevno, noću
    - cron: "20 14 * * *"   # švajcarski red vožnje ponovo, posle njihovog popodnevnog ažuriranja
  workflow_dispatch:   # ručno pokretanje: Actions -> SNCF podaci -> Run workflow

concurrency:
  group: sync-${{ github.event.schedule || 'rucno' }}
  cancel-in-progress: false

jobs:
  red-voznje:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Francuska – red vožnje
        if: github.event.schedule != '20 14 * * *'
        continue-on-error: true
        run: node ingest/sync-schedule.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Švajcarska – red vožnje
        continue-on-error: true
        run: node ingest/sync-schedule.mjs
        env:
          COUNTRY: ch
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Belgija – red vožnje
        if: github.event.schedule != '20 14 * * *'
        continue-on-error: true
        run: node ingest/sync-schedule.mjs
        env:
          COUNTRY: be
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Holandija – red vožnje
        if: github.event.schedule != '20 14 * * *'
        continue-on-error: true
        run: node ingest/sync-schedule.mjs
        env:
          COUNTRY: nl
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Luksemburg – red vožnje
        if: github.event.schedule != '20 14 * * *'
        continue-on-error: true
        run: node ingest/sync-schedule.mjs
        env:
          COUNTRY: lu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # bez continue-on-error: ako nešto nije u redu sa mapama ili podacima, korak pada i GitHub šalje e-mail
      - name: Provera mapa i podataka
        if: github.event.schedule != '20 14 * * *'
        run: node ingest/check-maps.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
